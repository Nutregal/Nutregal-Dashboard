<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murken Sell-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --rail:          #163a16;
    --rail-2:        #1f4d1e;
    --rail-active:   #2a6427;
    --rail-ink:      #e9f0e6;
    --rail-muted:    #9ab394;

    --page:          #f5f7f3;
    --card:          #ffffff;
    --ink:           #16210f;
    --ink-2:         #505b47;
    --ink-3:         #8d9885;
    --line:          #e5e9e0;
    --line-soft:     #eff2eb;

    /* verde de marca: unico color de las marcas de datos */
    --green:         #3d7a34;
    --green-soft:    #e8f1e4;
    /* dorado de marca: logo y acentos, nunca marcas de datos */
    --gold:          #f0a818;
    --gold-ink:      #184818;
    --gold-deep:     #c07818;
    --gold-soft:     #fdf1dc;
    --up:            #2a6427;
    --down:          #c4432f;

    --r:             10px;
    --shadow:        0 1px 2px rgba(22,58,22,.05), 0 1px 12px rgba(22,58,22,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --rail:        #0f2a0f;
      --rail-2:      #193d18;
      --rail-active: #245621;
      --rail-ink:    #e9f0e6;
      --rail-muted:  #9ab394;
      --page:        #0c120b;
      --card:        #141c14;
      --ink:         #f2f6f0;
      --ink-2:       #adb9a6;
      --ink-3:       #7f8c78;
      --line:        #253025;
      --line-soft:   #1b241b;
      --green:       #63a94f;
      --green-soft:  #1a2c18;
      --gold:        #f0a818;
      --gold-ink:    #184818;
      --gold-deep:   #d99a22;
      --gold-soft:   #2e2412;
      --up:          #63a94f;
      --down:        #e0705c;
      --shadow:      0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --rail:        #0f2a0f;
    --rail-2:      #193d18;
    --rail-active: #245621;
    --rail-ink:    #e9f0e6;
    --rail-muted:  #9ab394;
    --page:        #0c120b;
    --card:        #141c14;
    --ink:         #f2f6f0;
    --ink-2:       #adb9a6;
    --ink-3:       #7f8c78;
    --line:        #253025;
    --line-soft:   #1b241b;
    --green:       #63a94f;
    --green-soft:  #1a2c18;
    --gold:        #f0a818;
    --gold-ink:    #184818;
    --gold-deep:   #d99a22;
    --gold-soft:   #2e2412;
    --up:          #63a94f;
    --down:        #e0705c;
    --shadow:      0 1px 2px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 400 14px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }

  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }

  .rail {
    background: var(--rail); color: var(--rail-ink);
    display: flex; flex-direction: column; gap: 4px;
    padding: 20px 14px; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 20px; }
  .brand img {
    width: 42px; height: 42px; flex: none; border-radius: 9px;
    background: #fff; padding: 2px; display: block;
  }
  .brand-txt { line-height: 1.15; min-width: 0; }
  .brand-txt .l1 { font-size: 10.5px; font-weight: 500; color: var(--rail-muted); letter-spacing: .015em; }
  .brand-txt .l2 { font-size: 17px; font-weight: 800; letter-spacing: -.015em; color: var(--rail-ink); }

  .navlbl {
    color: var(--rail-muted); font-size: 10.5px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px 6px;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: center; gap: 11px; width: 100%;
    background: none; border: 0; border-radius: 8px; cursor: pointer;
    padding: 9px 10px; color: var(--rail-muted);
    font: 500 13.5px/1 "Plus Jakarta Sans", system-ui, sans-serif; text-align: left;
  }
  .nav button svg { width: 17px; height: 17px; flex: none; }
  .nav button:hover { background: var(--rail-2); color: var(--rail-ink); }
  .nav button[aria-current="true"] { background: var(--rail-active); color: #fff; font-weight: 600; }
  .nav button:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }

  .rail-foot {
    margin-top: auto; background: var(--rail-2); border-radius: var(--r);
    padding: 13px 14px; font-size: 12px; color: var(--rail-muted); line-height: 1.45;
  }
  .rail-foot strong { color: var(--rail-ink); display: block; font-size: 12.5px; margin-bottom: 3px; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 5; background: var(--page);
    border-bottom: 1px solid var(--line);
    padding: 22px 30px 18px;
    display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap;
  }
  .topbar h1 { margin: 0 0 3px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
  .topbar p { margin: 0; color: var(--ink-2); font-size: 13px; max-width: 62ch; }
  .topbar .grow { flex: 1 1 240px; }
  .controls { display: flex; gap: 9px; align-items: center; }

  select.msel, button.act {
    font: 500 13px "Plus Jakarta Sans", system-ui, sans-serif;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 9px 12px; cursor: pointer;
  }
  button.act { background: var(--rail); color: #fff; border-color: var(--rail); font-weight: 600; }
  button.act:hover { background: var(--rail-2); }
  select.msel:focus-visible, button.act:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }

  .body { padding: 24px 30px 60px; display: flex; flex-direction: column; gap: 18px; }
  section[hidden] { display: none !important; }
  .stack { display: flex; flex-direction: column; gap: 18px; }

  .banner {
    display: flex; gap: 11px; align-items: flex-start;
    background: var(--gold-soft); border-radius: var(--r);
    padding: 13px 15px; font-size: 13px; color: var(--ink-2);
    border-left: 3px solid var(--gold-deep);
  }
  .banner strong { color: var(--ink); }
  .banner[hidden] { display: none !important; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .tile {
    background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
    padding: 16px 17px; display: flex; gap: 13px; align-items: flex-start;
  }
  .ico { width: 40px; height: 40px; border-radius: 9px; flex: none; display: grid; place-items: center; }
  .ico svg { width: 19px; height: 19px; }
  .ico.t { background: var(--green); color: #fff; }
  .ico.o { background: var(--gold); color: var(--gold-ink); }
  .ico.d { background: var(--rail); color: #fff; }
  .tile .k { color: var(--ink-2); font-size: 12.5px; font-weight: 500; margin-bottom: 2px; }
  .tile .v { font-size: 24px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; }
  .delta { font-size: 12px; font-weight: 600; margin-top: 3px; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--ink-3); font-weight: 500; }
  .delta em { font-style: normal; color: var(--ink-3); font-weight: 500; }

  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 19px; }
  .card h2 { margin: 0 0 2px; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
  .card .note { margin: 0 0 14px; color: var(--ink-3); font-size: 12px; max-width: 74ch; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }

  .chcard .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .chcard .top .ico { width: 32px; height: 32px; border-radius: 8px; }
  .chcard .top .ico svg { width: 15px; height: 15px; }
  .chcard .nm { font-weight: 700; font-size: 13.5px; }
  .chcard .lbl { color: var(--ink-2); font-size: 12.5px; }
  .chcard .big { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }
  .chcard dl { margin: 12px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 10px; font-size: 12.5px; }
  .chcard dt { color: var(--ink-2); }
  .chcard dd { margin: 0; text-align: right; font-weight: 600; }

  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .tick { fill: var(--ink-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .gridline { stroke: var(--line-soft); stroke-width: 1; }
  .baseline { stroke: var(--line); stroke-width: 1; }
  .endlab { fill: var(--ink); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hit { fill: transparent; cursor: pointer; }

  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
  th, td { text-align: right; padding: 9px 11px; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
  th.l, td.l { text-align: left; font-variant-numeric: normal; }
  th { color: var(--ink-3); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.grp { cursor: pointer; }
  tr.grp td { font-weight: 700; }
  tr.grp:hover td { background: var(--line-soft); }
  tr.sub td { color: var(--ink-2); font-weight: 400; }
  tr.sub td.l { padding-left: 32px; }
  .caret { display: inline-block; width: 13px; color: var(--ink-3); font-size: 10px; }
  .share { display: inline-block; height: 6px; border-radius: 3px; background: var(--green); vertical-align: middle; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px; margin-left: 6px;
    font-size: 11px; font-weight: 700; background: var(--gold-soft); color: var(--gold-deep);
  }

  .qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .qlist li { display: flex; gap: 11px; align-items: flex-start; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .qdot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold-deep); flex: none; margin-top: 6px; }
  .qdot.ok { background: var(--green); }

  .tip {
    position: fixed; pointer-events: none; z-index: 20;
    background: var(--rail); color: #fff; border-radius: 8px;
    padding: 8px 11px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.22); white-space: nowrap;
  }
  .tip[hidden] { display: none !important; }
  .tip .m { color: var(--rail-muted); font-size: 11px; margin-bottom: 3px; }
  .tip .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--rail); color: #fff; border-radius: 999px;
    padding: 10px 20px; font-size: 13px; font-weight: 600; z-index: 30;
    box-shadow: 0 8px 26px rgba(0,0,0,.24);
  }
  .toast[hidden] { display: none !important; }

  @media (max-width: 780px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .rail .brand { padding: 0 12px 0 4px; }
    .rail .navlbl, .rail-foot { display: none; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .topbar, .body { padding-left: 18px; padding-right: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<script>

const $ = (s) => document.querySelector(s);
const nf0 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 1 });
const MES3 = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

const mesCorto = (iso) => MES3[+iso.split("-")[1] - 1] + "-" + iso.split("-")[0].slice(2);
const mesLargo = (iso) => MES3[+iso.split("-")[1] - 1] + " " + iso.split("-")[0];
function pesos(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return "$" + nf1.format(v / 1e9) + "MM";
  if (a >= 1e6) return "$" + nf1.format(v / 1e6) + "M";
  if (a >= 1e3) return "$" + nf0.format(v / 1e3) + "K";
  return "$" + nf0.format(v);
}
const norm = (s) => (s || "").toString().toUpperCase()
  .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();

const ICON = {
  resumen:'<path d="M3 3v15a1 1 0 0 0 1 1h15"/><path d="M7 14l3.5-4 3 2.5L19 6"/>',
  canales:'<path d="M3 5h18"/><path d="M6 12h12"/><path d="M10 19h4"/>',
  clientes:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19a6 6 0 0 1 12 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6"/><path d="M17.5 19a5.6 5.6 0 0 0-2.2-4.4"/>',
  productos:'<path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="M4 8.5 12 13l8-4.5M12 13v7"/>',
  reconocimientos:'<path d="M5 4h14v16l-3.5-2.2L12 20l-3.5-2.2L5 20z"/><path d="M9 10h6"/>',
  calidad:'<path d="M12 3.5 20 7v5.5c0 4.2-3.2 7-8 8.5-4.8-1.5-8-4.3-8-8.5V7z"/><path d="m9 12 2 2 4-4"/>',

  peso:'<path d="M7 7h10l2.5 13H4.5z"/><path d="M9.5 7a2.5 2.5 0 0 1 5 0"/>',
  plata:'<path d="M12 2.5v19"/><path d="M17 6.5c0-2-2.2-3-5-3s-5 .9-5 3 2 2.8 5 3.4 5 1.4 5 3.6-2.2 3-5 3-5-1-5-3"/>',
  tasa:'<path d="M5 19 19 5"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>'
};
const svgIcon = (k) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON[k] || "") + '</svg>';

const VISTAS = [
  { id:"resumen",         nom:"Resumen",          sub:"Venta de Nutregal a sus distribuidores. No incluye el sell-out del canal tradicional." },
  { id:"canales",         nom:"Canales",          sub:"El canal se asigna a mano en canales.json; no viene de la base." },
  { id:"clientes",        nom:"Clientes",         sub:"Los clientes del sell-in, ordenados por volumen." },
  { id:"productos",       nom:"Productos",        sub:"Los 10 SKUs de producto real. Excluye material POP y reconocimientos." },
  { id:"reconocimientos", nom:"Reconocimientos",  sub:"Roturas, comerciales, retiros y defectuosos, separados del análisis comercial." },
  { id:"calidad",         nom:"Calidad de datos", sub:"Lo que conviene tener en cuenta antes de leer los números de arriba." }
];

let DATA = null, CANALES = null, MAPA = new Map(), mes = "todos", vista = "resumen";
const abiertos = new Set();

const canalDe = (c) => MAPA.get(norm(c)) || (CANALES && CANALES.default) || "SIN ASIGNAR";
const tieneCanal = (c) => MAPA.has(norm(c));
const excluido = (c) => !!(CANALES && (CANALES.excluir || []).some(e => norm(e) === norm(c)));
const meses = () => (DATA.serie_mensual || []).map(d => d.mes);
const serieSel = () => mes === "todos"
  ? (DATA.serie_mensual || [])
  : (DATA.serie_mensual || []).filter(d => d.mes === mes);

function filasCliente() {
  const f = (DATA.por_cliente || []).filter(r => !excluido(r.cliente));
  return mes === "todos" ? f : f.filter(r => r.mes === mes);
}
function filasSku() {
  const f = DATA.por_sku || [];
  return mes === "todos" ? f : f.filter(r => r.mes === mes);
}
const totales = (filas) => filas.reduce((a, r) => ({
  cajas: a.cajas + (r.cajas || 0), kilos: a.kilos + (r.kilos || 0), neto: a.neto + (r.neto || 0)
}), { cajas: 0, kilos: 0, neto: 0 });

function agrupar(filas, clave, hijoDe) {
  const m = new Map();
  filas.forEach(r => {
    const k = clave(r);
    if (!m.has(k)) m.set(k, { nombre: k, cajas: 0, kilos: 0, neto: 0, hijos: new Map(), meses: new Map() });
    const g = m.get(k);
    g.cajas += r.cajas || 0; g.kilos += r.kilos || 0; g.neto += r.neto || 0;
    g.meses.set(r.mes, (g.meses.get(r.mes) || 0) + (r.cajas || 0));
    if (hijoDe) {
      const nom = hijoDe(r), hk = norm(nom);
      if (!g.hijos.has(hk)) g.hijos.set(hk, { nombre: nom, cajas: 0, kilos: 0, neto: 0 });
      const h = g.hijos.get(hk);
      h.cajas += r.cajas || 0; h.kilos += r.kilos || 0; h.neto += r.neto || 0;
    }
  });
  return [...m.values()].sort((a, b) => b.cajas - a.cajas);
}

const tip = $("#tip");
function showTip(e, m, v) {
  tip.innerHTML = '<div class="m">' + m + '</div><div class="v">' + v + '</div>';
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 12;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 20;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };

function ejeY(max) {
  if (max <= 0) return [0, 1];
  const p = Math.pow(10, Math.floor(Math.log10(max)));
  let step = p;
  if (max / step > 5) step = p * 2;
  if (max / step < 2) step = p / 2;
  const out = [];
  for (let v = 0; v <= max * 1.001; v += step) out.push(v);
  out.push(out[out.length - 1] + step);
  return out;
}

function columnas(serie, campo, fmt, color) {
  const W = 620, H = 250, ML = 54, MR = 18, MT = 18, MB = 30;
  const iw = W - ML - MR, ih = H - MT - MB;
  const ticks = ejeY(Math.max(...serie.map(d => d[campo] || 0), 0));
  const top = ticks[ticks.length - 1] || 1;
  const y = v => MT + ih - (v / top) * ih;
  const band = iw / Math.max(serie.length, 1), bw = Math.min(24, band * 0.58);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  ticks.forEach(t => {
    s += '<line class="gridline" x1="' + ML + '" x2="' + (W - MR) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
         '<text class="tick" x="' + (ML - 9) + '" y="' + (y(t) + 3.5) + '" text-anchor="end">' + nf0.format(t) + '</text>';
  });
  serie.forEach((d, i) => {
    const v = d[campo] || 0, cx = ML + band * i + band / 2;
    const h = Math.max(0, MT + ih - y(v)), r = Math.min(4, bw / 2, h);
    const dim = mes !== "todos" && d.mes !== mes;
    if (h > 0) s += '<path d="M' + (cx - bw / 2) + ' ' + (MT + ih) + ' V' + (y(v) + r) +
      ' q0 ' + (-r) + ' ' + r + ' ' + (-r) + ' h' + (bw - 2 * r) + ' q' + r + ' 0 ' + r + ' ' + r +
      ' V' + (MT + ih) + ' Z" fill="' + color + '" opacity="' + (dim ? .26 : 1) + '"/>';
    s += '<rect class="hit" x="' + (ML + band * i) + '" y="' + MT + '" width="' + band + '" height="' + ih +
         '" data-m="' + d.mes + '" data-v="' + v + '"/>' +
         '<text class="tick" x="' + cx + '" y="' + (H - 9) + '" text-anchor="middle">' + mesCorto(d.mes) + '</text>';
  });
  const u = serie[serie.length - 1];
  if (u) s += '<text class="endlab" x="' + (ML + band * (serie.length - 1) + band / 2) + '" y="' +
    (y(u[campo] || 0) - 8) + '" text-anchor="middle">' + fmt(u[campo] || 0) + '</text>';
  s += '<line class="baseline" x1="' + ML + '" x2="' + (W - MR) + '" y1="' + (MT + ih) + '" y2="' + (MT + ih) + '"/></svg>';
  return s;
}

function linea(serie, campo, fmt, color) {
  const W = 1180, H = 250, ML = 66, MR = 56, MT = 20, MB = 30;
  const iw = W - ML - MR, ih = H - MT - MB;
  const vals = serie.map(d => d[campo] || 0).filter(v => v > 0);
  const vmin = vals.length ? Math.min(...vals) : 0, vmax = vals.length ? Math.max(...vals) : 1;
  const pad = Math.max((vmax - vmin) * .35, vmax * .02) || 1;
  const lo = Math.max(0, vmin - pad), hi = vmax + pad;
  const y = v => MT + ih - ((v - lo) / (hi - lo)) * ih;
  const x = i => ML + (serie.length === 1 ? iw / 2 : (iw / (serie.length - 1)) * i);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  [lo, lo + (hi - lo) / 2, hi].forEach(t => {
    s += '<line class="gridline" x1="' + ML + '" x2="' + (W - MR) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
         '<text class="tick" x="' + (ML - 9) + '" y="' + (y(t) + 3.5) + '" text-anchor="end">' + nf0.format(Math.round(t)) + '</text>';
  });
  s += '<polyline points="' + serie.map((d, i) => x(i) + "," + y(d[campo] || 0)).join(" ") +
       '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  serie.forEach((d, i) => {
    s += '<circle cx="' + x(i) + '" cy="' + y(d[campo] || 0) + '" r="4" fill="' + color +
         '" stroke="var(--card)" stroke-width="2"/>' +
         '<rect class="hit" x="' + (x(i) - iw / (serie.length * 2)) + '" y="' + MT + '" width="' + (iw / serie.length) +
         '" height="' + ih + '" data-m="' + d.mes + '" data-v="' + (d[campo] || 0) + '"/>' +
         '<text class="tick" x="' + x(i) + '" y="' + (H - 9) + '" text-anchor="middle">' + mesCorto(d.mes) + '</text>';
  });
  const u = serie[serie.length - 1];
  if (u) s += '<text class="endlab" x="' + (x(serie.length - 1) + 11) + '" y="' + (y(u[campo] || 0) + 4) +
    '" text-anchor="start">' + fmt(u[campo] || 0) + '</text>';
  s += '<line class="baseline" x1="' + ML + '" x2="' + (W - MR) + '" y1="' + (MT + ih) + '" y2="' + (MT + ih) + '"/></svg>';
  return s;
}

function sparkline(vals, color) {
  const W = 240, H = 54, P = 4;
  const max = Math.max(...vals, 1);
  const x = i => P + (vals.length <= 1 ? (W - 2 * P) / 2 : ((W - 2 * P) / (vals.length - 1)) * i);
  const y = v => H - P - (v / max) * (H - 2 * P - 5);
  const pts = vals.map((v, i) => x(i) + "," + y(v)).join(" ");
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-hidden="true">' +
    '<polygon points="' + P + ',' + (H - P) + ' ' + pts + ' ' + (W - P) + ',' + (H - P) +
    '" fill="' + color + '" opacity=".10"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" ' +
    'stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + x(vals.length - 1) + '" cy="' + y(vals[vals.length - 1] || 0) + '" r="3.5" fill="' + color +
    '" stroke="var(--card)" stroke-width="2"/></svg>';
}

function armarHits(host, fmt) {
  host.querySelectorAll(".hit").forEach(el => {
    el.addEventListener("mousemove", e => showTip(e, mesLargo(el.dataset.m), fmt(+el.dataset.v)));
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("click", () => setMes(el.dataset.m === mes ? "todos" : el.dataset.m));
  });
}

const tile = (cls, ico, k, v, extra) =>
  '<div class="tile"><div class="ico ' + cls + '">' + svgIcon(ico) + '</div>' +
  '<div><div class="k">' + k + '</div><div class="v num">' + v + '</div>' + (extra || "") + '</div></div>';

function deltaCajas() {
  const serie = DATA.serie_mensual || [];
  if (mes === "todos") return '<div class="delta flat">' + serie.length + ' meses</div>';
  const i = serie.findIndex(d => d.mes === mes);
  if (i < 1) return '<div class="delta flat">sin mes previo</div>';
  const prev = serie[i - 1].cajas || 0, act = serie[i].cajas || 0;
  if (!prev) return '<div class="delta flat">sin base de comparación</div>';
  const pct = ((act - prev) / prev) * 100, up = pct >= 0;
  return '<div class="delta ' + (up ? "up" : "down") + '">' + (up ? "↑" : "↓") + " " +
    nf1.format(Math.abs(pct)) + '% <em>vs ' + mesCorto(serie[i - 1].mes) + '</em></div>';
}

function vResumen() {
  const t = totales(serieSel());
  const tiles = '<div class="tiles">' +
    tile("t", "caja", "Cajas", nf0.format(t.cajas), deltaCajas()) +
    tile("o", "peso", "Kilos", nf0.format(t.kilos), '<div class="delta flat">medida comparable</div>') +
    tile("d", "plata", "Neto", pesos(t.neto), '<div class="delta flat">pesos nominales</div>') +
    tile("t", "tasa", "Neto por kilo", t.kilos ? "$" + nf0.format(t.neto / t.kilos) : "—",
         '<div class="delta flat">promedio del período</div>') + '</div>';

  const grupos = agrupar(filasCliente(), r => canalDe(r.cliente)).slice(0, 3);
  const todos = meses();
  const cards = '<div class="grid3">' + grupos.map((g, i) => {
    // Un solo verde para todas las sparklines: la identidad de cada tarjeta la da
    // su nombre, no el color. Verde y dorado juntos no separan para daltonismo.
    const cls = i === 1 ? "o" : "t", col = "var(--green)";
    return '<div class="card chcard"><div class="top"><div class="ico ' + cls + '">' +
      svgIcon("canales") + '</div><div class="nm">' + g.nombre + '</div></div>' +
      '<div class="lbl">Cajas</div><div class="big num">' + nf0.format(g.cajas) + '</div>' +
      sparkline(todos.map(m => g.meses.get(m) || 0), col) +
      '<dl><dt>Kilos</dt><dd class="num">' + nf0.format(g.kilos) + '</dd>' +
      '<dt>$/kg</dt><dd class="num">' + (g.kilos ? "$" + nf0.format(g.neto / g.kilos) : "—") + '</dd>' +
      '<dt>Neto</dt><dd class="num">' + pesos(g.neto) + '</dd></dl></div>';
  }).join("") + '</div>';

  const serie = DATA.serie_mensual || [];
  const fCajas = v => nf0.format(v) + " cajas";
  const fKilos = v => nf0.format(v) + " kg";
  const fPre = v => "$" + nf0.format(v) + "/kg";

  $("#v-resumen").innerHTML = tiles + cards +
    '<div class="grid2">' +
      '<div class="card"><h2>Cajas por mes</h2><p class="note">Producto real. Excluye material POP; incluye los bonificados sin facturar.</p><div id="ch1">' +
        columnas(serie, "cajas", v => nf0.format(v), "var(--green)") + '</div></div>' +
      '<div class="card"><h2>Kilos por mes</h2><p class="note">No la afecta el cambio de unidades por bulto de los SKUs de 36.</p><div id="ch2">' +
        columnas(serie, "kilos", v => nf0.format(v), "var(--green)") + '</div></div>' +
    '</div>' +
    '<div class="card"><h2>Neto por kilo</h2><p class="note">Pesos nominales, sin ajustar por inflación. El eje se ajusta al rango de los datos: no arranca en cero. Los meses bajos son mix de bonificados, no baja de precio.</p><div id="ch3">' +
      linea(serie, "neto_por_kg", v => "$" + nf0.format(v), "var(--green)") + '</div></div>';

  armarHits($("#ch1"), fCajas); armarHits($("#ch2"), fKilos); armarHits($("#ch3"), fPre);
}

const celdas = (o) => '<td class="num">' + nf0.format(o.cajas) + '</td>' +
  '<td class="num">' + nf0.format(o.kilos) + '</td>' +
  '<td class="num">' + (o.kilos ? "$" + nf0.format(o.neto / o.kilos) : "—") + '</td>' +
  '<td class="num">' + pesos(o.neto) + '</td>';

function vCanales() {
  const grupos = agrupar(filasCliente(), r => canalDe(r.cliente), r => r.cliente);
  const total = grupos.reduce((a, g) => a + g.cajas, 0);
  let cuerpo = "";
  grupos.forEach(g => {
    const ab = abiertos.has(g.nombre), pct = total ? (g.cajas / total) * 100 : 0;
    cuerpo += '<tr class="grp" data-g="' + g.nombre + '"><td class="l"><span class="caret">' +
      (ab ? "▼" : "▶") + '</span>' + g.nombre + '</td>' + celdas(g) +
      '<td class="num"><span class="share" style="width:' + Math.max(2, pct * .6) + 'px"></span> ' +
      nf1.format(pct) + '%</td></tr>';
    if (ab) [...g.hijos.values()].sort((a, b) => b.cajas - a.cajas).forEach(h => {
      const p = total ? (h.cajas / total) * 100 : 0;
      cuerpo += '<tr class="sub"><td class="l">' + h.nombre + '</td>' + celdas(h) +
        '<td class="num">' + nf1.format(p) + '%</td></tr>';
    });
  });
  $("#v-canales").innerHTML = '<div class="card"><h2>Volumen por canal</h2>' +
    '<p class="note">Clic en un canal para abrir sus clientes.</p><div class="tw"><table>' +
    '<thead><tr><th class="l">Canal / cliente</th><th>Cajas</th><th>Kilos</th><th>$/kg</th><th>Neto</th><th>% volumen</th></tr></thead>' +
    '<tbody>' + (cuerpo || '<tr><td class="l" colspan="6">Sin datos para este mes.</td></tr>') + '</tbody></table></div></div>';
  $("#v-canales").querySelectorAll("tr.grp").forEach(tr => tr.addEventListener("click", () => {
    const k = tr.dataset.g;
    abiertos.has(k) ? abiertos.delete(k) : abiertos.add(k);
    render();
  }));
}

function vClientes() {
  const filas = filasCliente(), total = totales(filas).cajas;
  const cuerpo = agrupar(filas, r => r.cliente).map(g => {
    const pct = total ? (g.cajas / total) * 100 : 0;
    const casiTodoBonif = g.kilos > 0 && (g.neto / g.kilos) < 7000;
    return '<tr><td class="l">' + g.nombre +
      (casiTodoBonif ? '<span class="pill">casi todo bonificado</span>' : '') + '</td>' +
      '<td class="l">' + canalDe(g.nombre) + '</td>' + celdas(g) +
      '<td class="num"><span class="share" style="width:' + Math.max(2, pct * .6) + 'px"></span> ' +
      nf1.format(pct) + '%</td></tr>';
  }).join("");
  $("#v-clientes").innerHTML = '<div class="card"><h2>Clientes</h2>' +
    '<p class="note">La etiqueta marca clientes con $/kg muy por debajo del resto: casi todo lo que recibieron fue sin cargo.</p>' +
    '<div class="tw"><table><thead><tr><th class="l">Cliente</th><th class="l">Canal</th><th>Cajas</th><th>Kilos</th><th>$/kg</th><th>Neto</th><th>% volumen</th></tr></thead>' +
    '<tbody>' + (cuerpo || '<tr><td class="l" colspan="7">Sin datos.</td></tr>') + '</tbody></table></div></div>';
}

function vProductos() {
  const sk = agrupar(filasSku(), r => r.articulo);
  const total = sk.reduce((a, g) => a + g.cajas, 0);
  const max = Math.max(...sk.map(g => g.cajas), 1);
  const cuerpo = sk.map(g => {
    const pct = total ? (g.cajas / total) * 100 : 0;
    return '<tr><td class="l">' + g.nombre + '</td>' + celdas(g) +
      '<td class="num"><span class="share" style="width:' + Math.max(2, (g.cajas / max) * 90) + 'px"></span> ' +
      nf1.format(pct) + '%</td></tr>';
  }).join("");
  $("#v-productos").innerHTML = '<div class="card"><h2>Productos</h2>' +
    '<p class="note">Los dos SKUs de 36 unidades pasaron de 66 a 60 unidades por bulto en may-26: para esos, la caja no es comparable en el tiempo.</p>' +
    '<div class="tw"><table><thead><tr><th class="l">SKU</th><th>Cajas</th><th>Kilos</th><th>$/kg</th><th>Neto</th><th>% volumen</th></tr></thead>' +
    '<tbody>' + (cuerpo || '<tr><td class="l" colspan="6">Sin datos.</td></tr>') + '</tbody></table></div></div>';
}

function vReconocimientos() {
  const rs = (DATA.reconocimientos || []).filter(r => mes === "todos" || r.mes === mes);
  const total = rs.reduce((a, r) => a + (r.neto || 0), 0);
  const pc = new Map();
  rs.forEach(r => pc.set(r.concepto, (pc.get(r.concepto) || 0) + (r.neto || 0)));
  const resumen = [...pc.entries()].sort((a, b) => a[1] - b[1]).map(([c, v]) =>
    '<tr><td class="l">' + c + '</td><td class="num">' + pesos(v) + '</td><td class="num">' +
    (total ? nf1.format((v / total) * 100) : "0") + '%</td></tr>').join("");
  const detalle = rs.slice().sort((a, b) => a.mes.localeCompare(b.mes) || a.neto - b.neto).map(r =>
    '<tr><td class="l">' + mesLargo(r.mes) + '</td><td class="l">' + r.concepto + '</td><td class="num">' +
    pesos(r.neto) + '</td></tr>').join("");
  $("#v-reconocimientos").innerHTML =
    '<div class="tiles">' + tile("o", "reconocimientos", "Total del período", pesos(total),
      '<div class="delta flat">no entra en el volumen comercial</div>') + '</div>' +
    '<div class="grid2">' +
      '<div class="card"><h2>Por concepto</h2><p class="note">Ordenado por impacto en pesos.</p><div class="tw"><table style="min-width:0">' +
      '<thead><tr><th class="l">Concepto</th><th>Neto</th><th>Peso</th></tr></thead><tbody>' +
      (resumen || '<tr><td class="l" colspan="3">Sin reconocimientos en este período.</td></tr>') + '</tbody></table></div></div>' +
      '<div class="card"><h2>Detalle por mes</h2><p class="note">Cada cargo, en orden cronológico.</p><div class="tw"><table style="min-width:0">' +
      '<thead><tr><th class="l">Mes</th><th class="l">Concepto</th><th>Neto</th></tr></thead><tbody>' +
      (detalle || '<tr><td class="l" colspan="3">Sin datos.</td></tr>') + '</tbody></table></div></div>' +
    '</div>';
}

function vCalidad() {
  const q = DATA.calidad || {}, items = [];
  const pop = q.material_pop_excluido || {};
  if (pop.cajas_pop) items.push(["ok", "Material POP excluido: " + nf0.format(pop.cajas_pop) +
    " bultos sin valor comercial (exhibidores, ganchera, tiras). Si contaran, inflarían el volumen."]);
  (q.articulos_sin_clasificar || []).forEach(a => items.push(["warn",
    "Artículo sin clasificar: " + a.articulo_id + " — " + nf0.format(a.cajas || 0) + " cajas, " +
    pesos(a.neto || 0) + ". Hay que decidir si es producto, POP o reconocimiento."]));
  (q.clientes_con_varios_ids || []).forEach(c => items.push(["warn",
    "Cliente con más de un ID: " + c.cliente + " → " + (c.ids || []).join(", ") +
    ". Acá se consolida por nombre, así que no aparece duplicado."]));
  const bon = (q.bonificados_sin_facturar || []).reduce((a, b) => a + (b.cajas || 0), 0);
  if (bon) items.push(["warn", "Bonificados sin facturar: " + nf0.format(bon) +
    " cajas. Cuentan como volumen pero no como facturación, y son la razón de los meses con $/kg bajo."]);
  const porArt = new Map();
  (q.unidades_por_bulto_variables || []).forEach(u => {
    if (!porArt.has(u.articulo_id)) porArt.set(u.articulo_id, []);
    (u.unidades || []).forEach(v => porArt.get(u.articulo_id).push({ mes: u.mes, v: v }));
  });
  porArt.forEach((serie, aid) => {
    const dist = [...new Set(serie.map(x => x.v))];
    if (dist.length < 2) return;
    serie.sort((a, b) => a.mes.localeCompare(b.mes));
    let corte = null;
    for (let i = 1; i < serie.length; i++) if (serie[i].v !== serie[i - 1].v) { corte = serie[i]; break; }
    items.push(["warn", "Artículo " + aid + ": las unidades por bulto pasaron de " + dist.join(" a ") +
      (corte ? " en " + mesLargo(corte.mes) : "") + ". Para ese SKU mirá los kilos, no las cajas."]);
  });
  const reco = (DATA.reconocimientos || []).reduce((a, r) => a + (r.neto || 0), 0);
  if (reco) items.push(["ok", "Reconocimientos separados del análisis comercial: " + pesos(reco) + "."]);
  const sinCanal = [...new Set((DATA.por_cliente || []).filter(r => !excluido(r.cliente))
    .filter(r => !tieneCanal(r.cliente)).map(r => r.cliente))];
  items.push(sinCanal.length
    ? ["warn", "Sin canal asignado en canales.json (" + sinCanal.length + "): " + sinCanal.join(", ") + "."]
    : ["ok", "Todos los clientes tienen canal asignado."]);
  const excl = (CANALES && CANALES.excluir) || [];
  if (excl.length) items.push(["ok", "Excluidos por ser ruido de carga: " + excl.join(", ") + "."]);

  $("#v-calidad").innerHTML = '<div class="card"><h2>Calidad de datos</h2>' +
    '<p class="note">Se recalcula en cada refresh. Naranja pide una decisión; verde ya está resuelto.</p>' +
    '<ul class="qlist">' + items.map(([t, x]) =>
      '<li><span class="qdot ' + (t === "ok" ? "ok" : "") + '"></span><span>' + x + '</span></li>').join("") +
    '</ul></div>';
}

function copiarTabla() {
  const tab = document.querySelector("section:not([hidden]) table");
  if (!tab) { toast("Esta vista no tiene tabla para copiar"); return; }
  const txt = [...tab.querySelectorAll("tr")]
    .map(tr => [...tr.querySelectorAll("th,td")].map(c => c.innerText.trim()).join("\t")).join("\n");
  navigator.clipboard.writeText(txt)
    .then(() => toast("Tabla copiada — pegala en Excel"))
    .catch(() => toast("El navegador no dejó copiar"));
}
let toastT;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600);
}

function setVista(id) {
  vista = id;
  VISTAS.forEach(v => { $("#v-" + v.id).hidden = v.id !== id; });
  $("#nav").querySelectorAll("button").forEach(b => b.setAttribute("aria-current", String(b.dataset.v === id)));
  const v = VISTAS.find(x => x.id === id);
  $("#vtitle").textContent = v.nom;
  $("#vsub").textContent = v.sub;
  render();
}
const setMes = (m) => { mes = m; $("#msel").value = m; render(); };

function render() {
  ({ resumen: vResumen, canales: vCanales, clientes: vClientes,
     productos: vProductos, reconocimientos: vReconocimientos, calidad: vCalidad })[vista]();
}

async function traer(url) {
  const r = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(url);
  return r.json();
}

(async function init() {
  let aviso = "";
  if (EMBEDDED_DATOS) { DATA = EMBEDDED_DATOS; CANALES = EMBEDDED_CANALES; }
  else {
    try { DATA = await traer("datos.json"); }
    catch (e) {
      aviso = "<strong>No se encontró datos.json.</strong> Corré <code>python scripts/build_data.py</code> para generarlo.";
      DATA = { serie_mensual: [], por_cliente: [], por_sku: [], reconocimientos: [], calidad: {} };
    }
    try { CANALES = await traer("canales.json"); }
    catch (e) { CANALES = { por_cliente: {}, default: "SIN ASIGNAR", excluir: [] }; }
  }
  MAPA = new Map();
  Object.keys((CANALES && CANALES.por_cliente) || {})
    .forEach(k => MAPA.set(norm(k), CANALES.por_cliente[k]));

  if (!aviso && DATA.generado_en) {
    const dias = (Date.now() - new Date(DATA.generado_en).getTime()) / 864e5;
    if (dias > 2) aviso = "<strong>Datos desactualizados.</strong> El último refresh fue hace " +
      Math.floor(dias) + " días. Conviene revisar el proceso diario.";
  }
  if (aviso) { $("#banner").innerHTML = "<span>" + aviso + "</span>"; $("#banner").hidden = false; }

  $("#foot-stamp").textContent = DATA.generado_en
    ? "Datos al " + new Date(DATA.generado_en).toLocaleDateString("es-AR",
        { timeZone: "America/Argentina/Buenos_Aires", day: "2-digit", month: "2-digit", year: "numeric" })
    : "Sin fecha de actualización";

  $("#nav").innerHTML = VISTAS.map(v =>
    '<button data-v="' + v.id + '" aria-current="' + (v.id === "resumen") + '">' +
    svgIcon(v.id) + "<span>" + v.nom + "</span></button>").join("");
  $("#nav").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => setVista(b.dataset.v)));

  $("#msel").innerHTML = '<option value="todos">Todos los meses</option>' +
    meses().map(m => '<option value="' + m + '">' + mesLargo(m) + "</option>").join("");
  $("#msel").addEventListener("change", e => setMes(e.target.value));
  $("#copy").addEventListener("click", copiarTabla);

  setVista("resumen");
})();
</script>
</body>
