name: Refresh datos.json

on:
  schedule:
    # 11:00 UTC = 08:00 ART (Argentina no tiene horario de verano)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-datos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar datos.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scripts/build_data.py --out datos.json

      - name: Commitear si cambio
        run: |
          if git diff --quiet -- datos.json; then
            echo "Sin cambios en datos.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          git commit -m "Refresh datos.json ($(date -u +%Y-%m-%d))"
          git push
